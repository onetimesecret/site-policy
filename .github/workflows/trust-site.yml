name: trust-site

# Build the trust.onetimesecret.com static site. The Astro project lives at the
# repository root. Node is pinned via .nvmrc (v24) so the build is reproducible;
# pnpm is pinned to the v9 line to match the lockfile (lockfileVersion 9.0).
#
# This is the PR/branch build check (every run produces the dist/ artifact).
# Publishing to BunnyCDN lives in deploy.yml — currently workflow_dispatch only,
# activated by uncommenting its push block once the subdomain, Bunny Pull Zone,
# and the production GitHub Environment secrets exist.

on:
  push:
    branches: ["**"]
    paths:
      - "src/**"
      - "public/**"
      - "astro.config.mjs"
      - "tsconfig.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".nvmrc"
      - ".github/workflows/trust-site.yml"
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "astro.config.mjs"
      - "tsconfig.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".nvmrc"
      - ".github/workflows/trust-site.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm must be installed before setup-node so its pnpm cache can resolve.
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - uses: actions/upload-artifact@v4
        with:
          name: trust-site-dist
          path: dist
          if-no-files-found: error
