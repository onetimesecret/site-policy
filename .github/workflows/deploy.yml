# .github/workflows/deploy.yml
#
# Publishes the trust.onetimesecret.com static site to BunnyCDN. Adapted from
# the proven onetimesecret/docs.onetimesecret.com deploy workflow (same Edge
# Storage upload + Pull Zone purge), retargeted to this repo's pinned toolchain
# (Node 24 via .nvmrc, pnpm 9, frozen install).
#
# NOT YET ACTIVE ON PUSH. Trigger is workflow_dispatch only until:
#   1. the trust.onetimesecret.com subdomain + Bunny Pull Zone exist, and
#   2. a "production" GitHub Environment is created with the secrets below.
# Once both are done, uncomment the `push:` block to deploy main automatically.
# (This repo also holds the legal documents, so keep the path filter so policy
# edits don't trigger a site deploy.)
#
# Required secrets/variables (scoped to the "production" — and optionally
# "staging" — GitHub Environment):
#
#   Secrets:
#     STORAGE_NAME         - Bunny Edge Storage zone name
#     STORAGE_ENDPOINT     - Storage host (e.g. storage.bunnycdn.com, or ny./la./uk.)
#     STORAGE_PASSWORD_RW  - Storage zone read/write password
#     PULL_ZONE_ID         - Bunny Pull Zone ID
#     BUNNY_API_KEY        - Bunny account API key (for cache purge)
#
# The site origin is currently hardcoded in astro.config.mjs
# (https://trust.onetimesecret.com). To mirror the docs repo's per-environment
# staging (.dev) / production (.com) split, make astro.config read a SITE_URL
# env var and pass it here per environment.

name: Build and Deploy to BunnyCDN

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

on:
  # Uncomment once the production Environment + Bunny secrets exist:
  # push:
  #   branches: [main]
  #   paths:
  #     - "src/**"
  #     - "public/**"
  #     - "astro.config.mjs"
  #     - "tsconfig.json"
  #     - "package.json"
  #     - "pnpm-lock.yaml"
  #     - ".nvmrc"
  #     - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # main -> production; any other ref (e.g. manual dispatch) -> staging
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # pnpm must be installed before setup-node so its pnpm cache can resolve.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm run build

      - name: Upload dist/ to Bunny Edge Storage
        env:
          STORAGE_ZONE: ${{ secrets.STORAGE_NAME }}
          STORAGE_ENDPOINT: ${{ secrets.STORAGE_ENDPOINT }}
          STORAGE_PASSWORD: ${{ secrets.STORAGE_PASSWORD_RW }}
        run: |
          set -euo pipefail
          if [ -z "${STORAGE_ENDPOINT}" ] || [ -z "${STORAGE_ZONE}" ] || [ -z "${STORAGE_PASSWORD}" ]; then
            echo "::error::STORAGE_NAME, STORAGE_ENDPOINT and STORAGE_PASSWORD_RW secrets must be configured for this environment."
            exit 1
          fi
          # Accept STORAGE_ENDPOINT with or without scheme / trailing slash,
          # then build the URL with a single https:// prefix.
          host="${STORAGE_ENDPOINT#http://}"; host="${host#https://}"; host="${host%/}"
          base="https://${host}/${STORAGE_ZONE}"
          echo "Upload base URL: ${base}"
          cd dist
          total=$(find . -type f | wc -l)
          echo "Uploading ${total} files to ${STORAGE_ZONE}..."

          _upload() {
            local file="$1"
            local encoded
            encoded=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$file")
            if ! curl -gfsS --retry 3 -X PUT \
              -H "AccessKey: ${STORAGE_PASSWORD}" \
              --data-binary "@${file}" \
              "${base}/${encoded}" > /dev/null 2>&1; then
              echo "::warning::Failed to upload: ${file}"
            fi
          }
          export -f _upload
          export base STORAGE_PASSWORD

          find . -type f -printf '%P\n' | xargs -P 8 -I{} bash -c '_upload "$@"' _ {}
          echo "Upload complete. ${total} files processed."

      - name: Wait for storage replication
        run: |
          echo "Waiting 10 seconds for BunnyCDN storage replication..."
          sleep 10

      - name: Purge Pull Zone cache
        env:
          PULLZONE_ID: ${{ secrets.PULL_ZONE_ID }}
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PULLZONE_ID}" ] || [ -z "${BUNNY_API_KEY}" ]; then
            echo "::warning::PULL_ZONE_ID or BUNNY_API_KEY not set — skipping cache purge."
            exit 0
          fi
          echo "Purging BunnyCDN pull zone cache..."
          response=$(curl -s -w "\n%{http_code}" --retry 3 -X POST \
            "https://api.bunny.net/pullzone/${PULLZONE_ID}/purgeCache" \
            -H "AccessKey: ${BUNNY_API_KEY}" \
            -H "Content-Type: application/json")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          if [[ "$http_code" -ge 200 && "$http_code" -lt 300 ]]; then
            echo "Cache purge completed successfully (HTTP $http_code)"
          else
            echo "Cache purge failed with HTTP $http_code"
            echo "Response: $body"
            exit 1
          fi
